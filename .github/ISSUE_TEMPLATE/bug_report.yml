name: 工具问题
description: 报告文本诊断、Word 工具、安装或打包问题
body:
  - type: input
    id: environment
    attributes:
      label: 版本与环境
      description: 技能版本、操作系统、Python 版本、宿主名称与版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤和最小输入
      description: 使用虚构或脱敏内容，不提交真实内部材料、个人信息或凭据。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果与预期结果
    validations:
      required: true
